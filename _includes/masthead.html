<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button aria-label="{% if page.lang == 'zh-CN' %}展开导航菜单{% else %}Toggle navigation menu{% endif %}"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg masthead__menu-home-item"><a href="#about-me">{% if page.lang == 'zh-CN' %}首页{% else %}Homepage{% endif %}</a></li>
          {% if page.lang == 'zh-CN' %}
          <li class="masthead__menu-item"><a href="#about-me">关于我</a></li>
          <li class="masthead__menu-item"><a href="#publications">论文</a></li>
          <li class="masthead__menu-item"><a href="#education">教育背景</a></li>
          <li class="masthead__menu-item"><a href="{{ '/assets/files/CV_魏晨.pdf' | relative_url }}">简历</a></li>
          {% else %}
          <li class="masthead__menu-item"><a href="#about-me">About Me</a></li>
          <li class="masthead__menu-item"><a href="#publications">Publications</a></li>
          <li class="masthead__menu-item"><a href="#education">Education</a></li>
          <li class="masthead__menu-item"><a href="{{ '/assets/files/CV_ChenWei.pdf' | relative_url }}">CV</a></li>
          {% endif %}
        </ul>
        <ul class="hidden-links hidden"></ul>
      </nav>
      <nav class="site-language" aria-label="{% if page.lang == 'zh-CN' %}网站语言{% else %}Website language{% endif %}">
        <a href="{{ '/' | relative_url }}" lang="en" hreflang="en"{% unless page.lang == 'zh-CN' %} aria-current="page"{% endunless %}>EN</a>
        <span aria-hidden="true">/</span>
        <a href="{{ '/zh/' | relative_url }}" lang="zh-CN" hreflang="zh-CN"{% if page.lang == 'zh-CN' %} aria-current="page"{% endif %}>中文</a>
      </nav>
    </div>
  </div>
</div>
